[theme]
base = "dark"

# Linear aesthetic — vedi design.md
primaryColor = "#5e69d1"
backgroundColor = "#08090a"
secondaryBackgroundColor = "#18191c"
textColor = "#f7f8f8"

linkColor = "#5e69d1"
codeTextColor = "#f7f8f8"
codeBackgroundColor = "#1b1e25"
borderColor = "#323439"

# Palette di stato / metric
greenColor = "#26a544"
greenBackgroundColor = "#1f2c24"
greenTextColor = "#3de261"
redColor = "#ff5d5e"
redBackgroundColor = "#2c1f21"
redTextColor = "#ff5d5e"
orangeColor = "#ff7235"
yellowColor = "#ff7235"
blueColor = "#00b8cb"
violetColor = "#5e69d1"
grayColor = "#8f9197"

chartCategoricalColors = [
    "#5e69d1", "#00b8cb", "#26a544", "#ff7235",
    "#ff5d5e", "#a8aab0", "#6a76e3", "#3de261"
]
chartSequentialColors = [
    "#1f2c24", "#18211f", "#1a2a2c", "#1b3236",
    "#164a52", "#0f6270", "#0aa0b3", "#00b8cb",
    "#33c8d8", "#66d8e3"
]

dataframeBorderColor = "#323439"
dataframeHeaderBackgroundColor = "#18191c"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 15
baseFontWeight = 400
codeFontSize = "0.85rem"
codeFontWeight = 500

headingFontSizes = ["32px", "24px", "20px", "16px", "15px", "13px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]

linkUnderline = false

# Radius — card 8px (rounded-lg), bottoni 6px (rounded-md)
baseRadius = "8px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#08090a"
secondaryBackgroundColor = "#18191c"
codeBackgroundColor = "#1b1e25"
textColor = "#f7f8f8"
borderColor = "#323439"
primaryColor = "#5e69d1"
