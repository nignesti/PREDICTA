# Raccolta delle quote Serie A per il calcolo del CLV (clv_serie_a.py).
# Due snapshot al giorno, orari serali italiani (17:00 e 20:00 UTC = 19:00 e
# 22:00 CEST/CET, prima e a ridosso dei calci d'inizio serali). Solo partite
# entro 36 ore: senza partite vicine il controllo su /events e' gratuito e
# /odds non viene chiamato. Costo in campionato: 2 crediti a snapshot (h2h +
# totals), ~120 al mese su 500, in aggiunta ai crediti usati dall'NBA (stesso
# secret ODDS_API_KEY, stesso account The Odds API).
name: Raccolta quote Serie A

on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quote-serie-a
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy scipy
      - name: Scarica le quote
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          QUOTE_MERCATI: h2h,totals
        run: python -m predicta.serie_a.quote.raccogli_quote_serie_a
      - name: Committa lo snapshot
        run: |
          git add quote_live/ || true
          if git diff --cached --quiet; then
            echo "Nessuno snapshot nuovo"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Snapshot quote Serie A $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
