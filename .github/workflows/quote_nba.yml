# Raccolta delle quote NBA per il calcolo del CLV (clv_nba.py).
# Due snapshot al giorno: 15:00 UTC (linee del mattino USA) e 23:00 UTC (a
# ridosso delle prime palle a due, ~23:30-00:00 UTC; e' la "chiusura"
# approssimata). Solo partite entro 36 ore: senza partite vicine (offseason,
# giorni di pausa) il controllo su /events e' gratuito e /odds non viene
# chiamato. Costo in stagione: 3 crediti a snapshot, ~180 al mese su 500.
# Richiede il secret del repository ODDS_API_KEY.
name: Raccolta quote NBA

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quote-nba
  cancel-in-progress: false

jobs:
  raccogli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy scipy
      - name: Scarica le quote
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          QUOTE_MERCATI: h2h,spreads,totals
        run: python raccogli_quote_nba.py
      - name: Committa lo snapshot
        run: |
          git add quote_live/ || true
          if git diff --cached --quiet; then
            echo "Nessuno snapshot nuovo"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Snapshot quote NBA $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
